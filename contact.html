<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Tastes of Africa</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Upright:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="logo">Tastes of Africa</a>
    <nav>
      <ul class="nav-list">
        <li><a href="index.html">Home</a></li>
        <li><a href="recipes.html">Recipes</a></li>
        <li><a href="regions.html">Regions</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="page-hero">
      <h1>Contact Us</h1>
      <p>We would love to hear from you. Send us a message below.</p>
    </section>

    <section class="contact container">
      <form id="contact-form" class="contact-form">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your name" required />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />
        </div>

        <div class="form-group">
          <label for="country">Country</label>
          <input
            type="text"
            id="country"
            name="country"
            list="country-suggestions"
            placeholder="Start typing your country" />
          <datalist id="country-suggestions">
            <option value="Nigeria"></option>
            <option value="Ghana"></option>
            <option value="Senegal"></option>
            <option value="Ivory Coast"></option>
            <option value="Morocco"></option>
            <option value="Egypt"></option>
            <option value="Tunisia"></option>
            <option value="Algeria"></option>
            <option value="Ethiopia"></option>
            <option value="Kenya"></option>
            <option value="Tanzania"></option>
            <option value="Rwanda"></option>
            <option value="Uganda"></option>
            <option value="South Africa"></option>
            <option value="Zimbabwe"></option>
          </datalist>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea
            id="message"
            name="message"
            rows="5"
            placeholder="Tell us what is on your mind"
            required></textarea>
        </div>

        <p id="contact-feedback" class="form-feedback" aria-live="polite"></p>
        <button type="submit">Send Message</button>
      </form>

      <div id="contact-success" class="contact-success hidden">
        <h2>Message Sent</h2>
        <p id="contact-success-text"></p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="newsletter">
        <h2>Stay in the Loop</h2>
        <p>Subscribe for new recipes and food stories from across Africa.</p>
        <form id="newsletter-form" class="newsletter-form">
          <input
            type="email"
            id="newsletter-email"
            name="email"
            placeholder="Your email address"
            required />
          <button type="submit">Subscribe</button>
        </form>
        <p id="newsletter-message" class="newsletter-message"></p>
      </div>
      <p class="copyright">&copy; 2026 Tastes of Africa. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
